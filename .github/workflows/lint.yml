---
name: Lint

"on":
  push:
    branches:
      - main
  pull_request:

jobs:
  lint-terraform:
    runs-on: ubuntu-22.04
    steps:
      - name: Clone repo
        uses: actions/checkout@v3
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Validate app_building
        run: terraform -chdir=terraform/app_building init -backend=false && terraform -chdir=terraform/app_building validate
      - name: Validate app
        run: terraform -chdir=terraform/app init -backend=false && terraform -chdir=terraform/app validate
      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3

  lint-ansible:
    runs-on: ubuntu-22.04
    steps:
      - name: Clone repo
        uses: actions/checkout@v3
      - name: Install ansible-lint
        run: pip install ansible-lint~=26.3.0
      - name: Install Galaxy dependencies
        run: ansible-galaxy collection install -r ansible/requirements.yml
      - name: Lint Ansible
        run: ansible-lint ansible/

  lint-yaml:
    runs-on: ubuntu-22.04
    steps:
      - name: Clone repo
        uses: actions/checkout@v3
      - name: Lint yaml
        uses: karancode/yamllint-github-action@v2.1.0
        with:
          yamllint_strict: true

  lint-packer:
    runs-on: ubuntu-22.04
    steps:
      - name: Clone repo
        uses: actions/checkout@v3
      - name: Initialise Packer
        run: packer init .
      - name: Validate Packer files
        run: packer validate -var "name=lint" ./*.pkr.hcl

  lint-go:
    runs-on: ubuntu-22.04
    steps:
      - name: Clone repo
        uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Lint Go files
        uses: golangci/golangci-lint-action@v9

  lint-shellcheck:
    runs-on: ubuntu-22.04
    steps:
      - name: Clone repo
        uses: actions/checkout@v3
      - name: Lint shell files
        uses: ludeeus/action-shellcheck@2.0.0
